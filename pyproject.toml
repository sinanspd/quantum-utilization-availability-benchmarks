[project]
name = "ibm-calibration-collector"
version = "0.1.0"
description = "Collect IBM Quantum backend status and calibration properties into PostgreSQL."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
analysis = [
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
]

[project.scripts]
ibm-calibration-collector = "ibm_calibration_collector.collector:main"
ibm-calibration-analyze = "ibm_calibration_collector.analysis:main"
ibm-calibration-backfill = "ibm_calibration_collector.backfill:main"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["ibm_calibration_collector*"]
